name: Temporary Education PR Formatter
on:
  push:
    branches:
      - feature/immersive-education-pathway-20261121
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier style to education feature files
        run: |
          npx prettier --write             src/app/play/tabs/CareerTab.tsx             src/app/stores/gameStore.ts             src/engine/core/commands.ts             src/engine/education/academicActions.ts             src/engine/education/catalog.ts             src/engine/education/school.ts             src/engine/state/schema.ts             src/engine/view.ts             tests/unit/engine/academicPathway.test.ts
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/play/tabs/CareerTab.tsx src/app/stores/gameStore.ts src/engine/core/commands.ts src/engine/education/academicActions.ts src/engine/education/catalog.ts src/engine/education/school.ts src/engine/state/schema.ts src/engine/view.ts tests/unit/engine/academicPathway.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format immersive education implementation"
            git push origin HEAD:feature/immersive-education-pathway-20261121
          fi
